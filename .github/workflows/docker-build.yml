name: Build and Push Docker Image

on:
  push:
    branches:
      - master
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert image name to lowercase
        id: image
        run: |
          IMAGE_NAME_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "name=${IMAGE_NAME_LOWER}" >> $GITHUB_OUTPUT
          echo "full_name=${{ env.REGISTRY }}/${IMAGE_NAME_LOWER}" >> $GITHUB_OUTPUT

      - name: Compute safe tag ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SAFE_REF="pr-${{ github.event.pull_request.number }}"
          else
            SAFE_REF=$(echo "${{ github.ref_name }}" | tr '/' '-')
          fi
          echo "safe_ref=${SAFE_REF}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Build and push (Dev)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: development
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.full_name }}:dev-latest
            ${{ steps.image.outputs.full_name }}:dev-${{ github.sha }}

      - name: Build and push (Prod)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.full_name }}:${{ steps.ref.outputs.safe_ref }}
            ${{ steps.image.outputs.full_name }}:${{ steps.ref.outputs.safe_ref }}-${{ github.sha }}

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: development
          load: true
          tags: radiocalico:test

      - name: Run tests
        run: |
          docker run --rm --entrypoint npm radiocalico:test test
          docker run --rm --entrypoint pytest radiocalico:test

      - name: Run linting (optional)
        continue-on-error: true
        run: |
          docker run --rm --entrypoint npm radiocalico:test run lint
          docker run --rm --entrypoint pylint radiocalico:test app/

  security-scan:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build prod image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          load: true
          tags: radiocalico:scan

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: radiocalico:scan
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security tab
        # Requires GitHub Advanced Security (paid) on private repos; the
        # Trivy scan output above still runs and prints results either way.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
