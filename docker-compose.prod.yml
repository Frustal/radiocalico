version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: radiocalico-postgres-prod
    environment:
      POSTGRES_DB: radiocalico
      POSTGRES_USER: radiocalico
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-in-production}
    volumes:
      - postgres-data-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radiocalico"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  radiocalico:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: radiocalico-prod
    image: radiocalico:latest
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:80"   # Nginx frontend (map to 80 for reverse proxy in production)
    environment:
      # Flask configuration
      FLASK_APP: main.py
      FLASK_ENV: production

      # Python configuration
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

      # Database: PostgreSQL in production
      DATABASE_URL: postgresql://radiocalico:${POSTGRES_PASSWORD:-change-this-in-production}@postgres:5432/radiocalico

      # Security: Change this in production!
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}

    # Restart policy for production
    restart: always

    # Resource limits (adjust based on your infrastructure)
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data-prod:
    driver: local

networks:
  default:
    name: radiocalico-network
