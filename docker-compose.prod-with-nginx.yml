version: '3.8'

# Production setup with separate Nginx reverse proxy container
# NOTE: nginx is now embedded in the Dockerfile. Use docker-compose.prod.yml instead.
# This file is kept for reference if you need a separate nginx container.

services:
  postgres:
    image: postgres:16-alpine
    container_name: radiocalico-postgres-prod
    environment:
      POSTGRES_DB: radiocalico
      POSTGRES_USER: radiocalico
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-in-production}
    volumes:
      - postgres-data-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radiocalico"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - radiocalico-network

  radiocalico:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: radiocalico-prod-app
    image: radiocalico:latest
    depends_on:
      postgres:
        condition: service_healthy
    # Don't expose ports directly - only to nginx
    expose:
      - "5000"
    environment:
      FLASK_APP: main.py
      FLASK_ENV: production
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      DATABASE_URL: postgresql://radiocalico:${POSTGRES_PASSWORD:-change-this-in-production}@postgres:5432/radiocalico
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}

    restart: always

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Only accessible from nginx
    networks:
      - radiocalico-network

  nginx:
    image: nginx:alpine
    container_name: radiocalico-prod-nginx
    ports:
      - "80:80"
      # Uncomment and configure for HTTPS:
      # - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/app/static:ro
      # For HTTPS, mount certificates:
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - radiocalico
    restart: always

    networks:
      - radiocalico-network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data-prod:
    driver: local

networks:
  radiocalico-network:
    name: radiocalico-network
    driver: bridge
