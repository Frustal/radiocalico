version: '3.8'

# Production setup with Nginx reverse proxy
# Use this instead of docker-compose.prod.yml when you want nginx in front

services:
  radiocalico:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: radiocalico-prod-app
    image: radiocalico:latest
    # Don't expose ports directly - only to nginx
    expose:
      - "3000"
      - "5000"
    volumes:
      - radiocalico-data:/app/instance
    environment:
      FLASK_APP: main.py
      FLASK_ENV: production
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: sqlite:////app/instance/radiocalico.db
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}

    restart: always

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Only accessible from nginx
    networks:
      - radiocalico-network

  nginx:
    image: nginx:alpine
    container_name: radiocalico-prod-nginx
    ports:
      - "80:80"
      # Uncomment and configure for HTTPS:
      # - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # For HTTPS, mount certificates:
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - radiocalico
    restart: always

    networks:
      - radiocalico-network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  radiocalico-data:
    driver: local

networks:
  radiocalico-network:
    name: radiocalico-network
    driver: bridge
