# Nginx reverse proxy configuration for Radio Calico
# Use this when running radiocalico behind nginx in production

upstream radiocalico_app {
    # Docker service name (resolves via Docker DNS)
    server radiocalico:3000;

    # For multiple instances:
    # server radiocalico1:3000;
    # server radiocalico2:3000;
    # server radiocalico3:3000;
}

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    # Redirect HTTP to HTTPS in production (uncomment when SSL is configured)
    # return 301 https://$server_name$request_uri;

    # Gzip compression for better performance
    gzip on;
    gzip_types text/plain text/css text/javascript application/json application/javascript;
    gzip_min_length 1000;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Client upload size limit
    client_max_body_size 10M;

    # Proxy timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Main application
    location / {
        proxy_pass http://radiocalico_app;

        # Forward headers to application
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # WebSocket support (if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Buffering settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # API endpoints with rate limiting
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://radiocalico_app;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # API-specific headers
        proxy_set_header Content-Type application/json;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://radiocalico_app/;
        access_log off;
    }

    # Static files (if serving directly from nginx for better performance)
    # location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
    #     proxy_pass http://radiocalico_app;
    #
    #     # Cache static assets
    #     expires 30d;
    #     add_header Cache-Control "public, immutable";
    #
    #     access_log off;
    # }

    # Deny access to sensitive paths
    location ~ /\.git {
        deny all;
        access_log off;
        log_not_found off;
    }
}

